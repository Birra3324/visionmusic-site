[build]
  publish = "."

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/delete-account"
  to = "/delete-account.html"
  status = 301

[[redirects]]
  from = "https://www.visionmusic.et/*"
  to = "https://visionmusic.et/:splat"
  status = 301
  force = true
